name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis portable --publish never
      - run: node scripts/smoke-packaged.mjs
      - run: node scripts/smoke-workflow.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: DraftDock-Windows
          path: release/*
          if-no-files-found: error
